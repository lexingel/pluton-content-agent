name: Daily Content Post

on:
  schedule:
    # 08:00 Türkiye saati (UTC+3) = 05:00 UTC. Adjust as you like.
    - cron: "0 5 * * *"
  workflow_dispatch: {}  # lets you also trigger it manually from the Actions tab

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 360  # must exceed PUBLISH_DELAY_HOURS
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install anthropic requests

      - name: Run pipeline
        working-directory: content_agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
          FAL_KEY: ${{ secrets.FAL_KEY }}
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          SFTP_REMOTE_BLOG_DIR: ${{ secrets.SFTP_REMOTE_BLOG_DIR }}
          IG_BUSINESS_ACCOUNT_ID: ${{ secrets.IG_BUSINESS_ACCOUNT_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NOTIFY_TO_ADDRESS: ${{ secrets.NOTIFY_TO_ADDRESS }}
          PUBLISH_DELAY_HOURS: "3"
        run: python main.py
